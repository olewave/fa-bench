[project]
name = "fa-bench"
dynamic = ["version"]
description = "Word and phone timestamp accuracy of forced aligners and timestamped ASR on clean and noisy speech, scored against hand-marked TIMIT and Buckeye boundaries."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Every notice the distribution must carry, so each lands in the wheel's
# dist-info/licenses and in the sdist: ours and Kaldi's.
license-files = [
    "LICENSE",
    "NOTICE",
    "fabench/dataprep/noisemix/kaldi/COPYING",
]
authors = [{ name = "Olewave, LLC" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core deps (aligner-specific extras installed on demand — see fabench/aligners/*).
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "pandas",
    "pyarrow",        # parquet leaderboard outputs (pandas .to_parquet)
    "pyyaml",
    "praatio",
    "tqdm",
    "requests",
]

[project.urls]
Homepage = "https://github.com/olewave/fa-bench"
Leaderboard = "https://olewave.com/en/leaderboard/fa-bench"
Paper = "https://arxiv.org/abs/2609.32396"
Changelog = "https://github.com/olewave/fa-bench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# NO torch extra. Every aligner now runs in its own interpreter, so nothing
# FA-Bench imports needs torch, torchaudio, transformers or phonemizer -- each
# tool's download_and_install.sh installs its own, pinned. This extra existed
# for the adapters that used to import torch in-process (torchaudio_fa, then
# bfa/neufa/whisperx); all of them moved out.
#
# The whisperx extra went with them: it installed whisperx HERE, which is what
# dragged transformers and torch to its own pins under Charsiu and BFA. It now
# lives in evals/aligners/whisperx/venv, built by that tool's own recipe.
test = ["pytest"]
# The ONE genuine exception to "no aligner dependency lives here". The MAPS
# adapter builds a pronunciation dictionary from the corpus vocabulary before
# MAPS runs, and does it IN THIS PROCESS -- MAPS itself never sees g2p_en, so
# it is absent from the tool's requirements.txt and cannot be installed by its
# recipe. It was therefore installed by hand once and declared nowhere: when
# something later pruned it, `fabench run` reported "MAPS needs g2p_en",
# exited 0, and left the previous hypotheses in place. Two published Buckeye
# noise cells silently carried the CLEAN alignment as a result. Declared here
# so a fresh clone gets it and a prune cannot take it back.
maps = ["g2p-en"]

[project.scripts]
fabench = "fabench.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fabench.__version__"}

[build-system]
# 77 is the first setuptools that reads license-files (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabench*"]
# Tests live beside the code they cover (fabench/<module>/test/), which is
# good for finding them and wrong for shipping them: exclude from wheels.
exclude = ["fabench*.test", "fabench*.test.*"]

# The noise recipe is shell + a vendored kaldi tree, and setuptools ships
# NEITHER by default -- only .py inside a package. A wheel built without this
# reported `.sh shipped: 0`: `pip install fabench` got utt2dur.py and
# materialise.py but not the make_noisy.sh that calls them, and got the
# vendored kaldi's .py while dropping its make_musan.sh. A half-installed
# recipe that fails at run time, not install time.
#
# kaldi/steps/data has no __init__.py so its .py are DATA, not modules;
# kaldi/steps/libs does have one and is found as a package, but its non-.py
# files still need listing here.
[tool.setuptools.package-data]
# Ship in-package YAML (fabench/{noise,score}/config.yaml, normalize/en/
# config.yaml) with wheels, not just editable installs.
fabench = ["**/*.yaml"]
"fabench.dataprep.noisemix" = [
    "*.sh",
    "kaldi/PROVENANCE.md",
    "kaldi/steps/data/*.py",
    "kaldi/steps/data/*.sh",
]

[tool.pytest.ini_options]
testpaths = ["fabench", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# tests/repro rebuilds a published snapshot from frozen inputs that
# never leave a local disk, so it skips unless FABENCH_REPRO_INPUTS names them.
# Select it alone with `python -m pytest -m repro tests/repro`.
markers = ["repro: rebuilds a published snapshot from frozen local inputs"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party trees. Linting them reported 11,423 findings against code
# we are not allowed to modify -- Kaldi is Apache-2.0 -- which buried the 256
# findings in our own code and made `ruff check .` useless as a signal. Each
# tool's `repo/` is its upstream checkout.
extend-exclude = [
    "tools/",
    "fabench/dataprep/noisemix/kaldi/",
    "evals/*/*/repo/",
    "evals/*/*/venv/",
]

[tool.ruff.lint]
# Two rules are switched off with reasons rather than annotated site by site.
ignore = [
    # BLE001 blind-except (26 sites). Every adapter, processor and worker
    # catches broadly on purpose: one tool's failure must not abort a sweep of
    # eleven systems across twenty cells. The catches log to stderr and carry on.
    #
    # Carrying on is not the same as reporting success: `fabench run` records
    # every failed or empty aligner cell and exits non-zero (pipeline.py), so a
    # sweep that loses a tool cannot finish green. Locked by
    # test_run_exits_nonzero_when_an_aligner_raises / ..._emits_nothing.
    "BLE001",
    # B023 loop-variable capture (11 sites, in the score runner and the
    # torchaudio ASR worker). Each closure is built and consumed inside the same
    # iteration, so late binding never occurs; ruff cannot prove it.
    "B023",
]

# Two rules that are right for the library and wrong for the scripts beside it.
# Both are clean inside fabench/ and stay enforced there.
[tool.ruff.lint.per-file-ignores]
"evals/**" = [
    # ISC004 implicit concatenation in a collection (3 sites). cloud_cost.py
    # writes each provider's long price note as adjacent string literals inside
    # its rate tuple. Parenthesising each run would add brackets for no gain.
    "ISC004",
    # SIM115 open() without a context manager (3 sites). These are per-cell
    # workers that read a file once into a comprehension and exit. A `with`
    # around each would add a nesting level to a throwaway read. Library code
    # under fabench/ has none of these.
    "SIM115",
]
