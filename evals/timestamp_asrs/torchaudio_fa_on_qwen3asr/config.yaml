# CASCADE RECIPE: torchaudio_fa aligning what qwen3_asr decoded.
#
# Track 2 by construction -- the words were recognised, not given --
# so this belongs beside the timestamped ASRs. Scoring still uses the
# reference gold, so recognition error costs this row exactly what it
# costs a one-step ASR and the two are directly comparable.
#
# transcript_hyp is set PER CELL, never here: a cascade is only
# meaningful when the upstream hypothesis came from the matching
# corpus, split and condition. requires_transcript_hyp makes running
# this recipe directly an error rather than a silent gold run.
# Generated by evals/gen_cascade_configs.py -- do not hand-edit.
name: torchaudio_fa_on_qwen3asr
adapter: torchaudio_fa
enabled: true
modes:
- A
- B
granularity:
- word
- phone
emits_confidence: true
params:
