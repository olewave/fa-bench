# CASCADE RECIPE: mfa aligning what qwen3_asr decoded.
#
# Track 2 by construction -- the words were recognised, not given.
# Scoring still uses the reference gold, so recognition error costs
# this row what it costs a one-step ASR; the two are comparable.
#
# transcript_hyp is set PER CELL, never here. requires_transcript_hyp
# makes running this recipe directly an error rather than a silent
# gold run. Generated by evals/gen_cascade_configs.py.
name: mfa3_on_qwen3asr
adapter: mfa
enabled: true
modes:
- A
granularity:
- word
- phone
params:
  version: '3.4'
  mamba_root: ../../aligners/mfa/repo/mamba
  micromamba: ../../aligners/mfa/repo/mamba/bin/micromamba
  dictionary: english_us_arpa
  acoustic_model: english_us_arpa
  requires_transcript_hyp: true
