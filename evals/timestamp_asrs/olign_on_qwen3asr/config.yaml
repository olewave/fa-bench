# CASCADE RECIPE: olign aligning what qwen3_asr decoded.
#
# Track 2 by construction -- the words were recognised, not given.
# Scoring still uses the reference gold, so recognition error costs
# this row what it costs a one-step ASR; the two are comparable.
#
# transcript_hyp is set PER CELL, never here. requires_transcript_hyp
# makes running this recipe directly an error rather than a silent
# gold run. Generated by evals/gen_cascade_configs.py.
name: olign_on_qwen3asr
adapter: olign
enabled: true
modes:
- A
granularity:
- word
- phone
emits_confidence: true
params:
  transport: rest
  # No endpoint here. It is machine-specific and this file is public, so
  # it comes from OLIGN_BASE_URL in .fabench.env, the same as the base
  # olign recipe. Set params.base_url in a private variant to pin one.
  accent: 2
  timeout_s: 60
  concurrency: 8
  requires_transcript_hyp: true
