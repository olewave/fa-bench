# MFA 3.4 with the english_mfa model and the default beam. A variant of the mfa recipe
# for comparing MFA's settings yourself. The leaderboard row is the mfa recipe.
#
# It uses the environment that ../../download_and_install.sh builds. MFA keeps
# its working files in one folder per user, so run one MFA recipe at a time,
# or give each recipe its own params.mfa_root with a copy of the models.
name: mfa_english_mfa
adapter: mfa
enabled: true
modes: [A]
granularity: [word]
params:
  version: "3.4"
  mamba_root: ../../repo/mamba
  dictionary: english_mfa
  acoustic_model: english_mfa
