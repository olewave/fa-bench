# MAPS -- Mason-Alberta Phonetic Segmentor, TensorFlow, phone-level.
#
# PARTIAL OVERLAP, AND NOT THROUGH ANY FAULT OF THEIRS. The timbuck model is
# trained on TIMIT + Buckeye, and its model card states the split exactly:
# Buckeye speaker 4 held out for validation, speakers 27, 38, 39 and 40 for
# test, plus the TIMIT test set. Buckeye ships no official split, so FA-Bench
# picked a different one, and the two disagree:
#   TIMIT        -- no overlap. Our dev and core test are both carved from
#                   TIMIT TEST, which MAPS did not train on.
#   Buckeye dev  -- 7 of our 8 speakers are in its training set (s40 is not).
#   Buckeye test -- 7 of our 8 (s04 was their validation speaker).
# So the Buckeye rows are not held out and must be reported as such, and the
# TIMIT rows are clean. Verify with the model card at
# repo/MAPS/timbuck_eng_model_card.md.
name: maps
adapter: maps
enabled: true
modes: [A]
granularity: [phone]
params:
  repo_path: repo/MAPS
  python: repo/env/bin/python
  # top-level timbuck_eng.tf is a SavedModel DIRECTORY (saved_model.pb +
  # variables/), and is the adapter default -- this is what the original run used.
  # ensemble_model/timbuck_eng_{1..10}.tf are the 10 individual members;
  # selecting one of those would NOT reproduce the published number.
  model: repo/MAPS/timbuck_eng.tf
  device: cuda
