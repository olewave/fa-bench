# Same model, worker and venv as fusealign_hub. Words the model does not place are
# dropped instead of keeping the fallback interval; `n_unplaced` in hyp meta counts them.
name: fusealign_hub_drop
adapter: fusealign_hub
enabled: true
modes: [A]
granularity: [word]
emits_confidence: true
params:
  venv: ../../venv
  model: Zyphra/fusealign
  revision: a4d58de4f0c6aff1e00f36e27bc58c901a39c359
  checkpoint: fusealign-multilingual-ns4-step60000.safetensors
  device: cuda
  batch_size: 64        # package default; bf16 batch rounding only (package README: Buckeye mean asymmetric error 27.32 -> 27.36 ms)
  unplaced: drop
  timeout_s: null
