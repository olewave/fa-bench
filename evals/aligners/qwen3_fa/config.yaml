# Qwen3-ForcedAligner-0.6B -- word-level forced alignment.
# https://huggingface.co/Qwen/Qwen3-ForcedAligner-0.6B
#
# A FORCED ALIGNER (audio + reference transcript -> word times), which is why it
# is here and not in evals/asrs/. Do not confuse it with Qwen3-ASR, a different
# model that decodes its own transcript.
#
# Word-level only -- no phone tier, so it is absent from the phone tables by
# construction, exactly like WhisperX.
#
# MEASURED on 8 TIMIT core_test utterances (69 items, 2026-08-07): items are
# 1:1 with the reference words, boundaries are monotonic, and 7.2% of items have
# ZERO duration (end_time == start_time). Those are passed through unchanged --
# they are the model's actual output, and inventing a duration would fabricate a
# boundary it never produced. The per-utterance count is recorded in meta.
name: qwen3_fa
adapter: qwen3_fa
enabled: true
modes: [A]                 # from text; no gold-phone mode
granularity: [word]
emits_confidence: false
# Runs in its OWN interpreter via evals/aligners/qwen3_fa/worker.py, not
# in-process: qwen_asr needs transformers 4.57.6 vs the shared .venv's 5.14.1,
# and mixing the two site-packages fails on a native extension (cffi 2.1.1 vs
# _cffi_backend 2.1.0) which no sys.path ordering can resolve. Batch adapter, so
# the model loads once per cell rather than once per utterance.
params:
  venv: venv
  # Buckeye cells are 4,456 / 4,513 utts at ~1.9 s each -> ~2.4 h.
  # 7200 s killed both mid-batch and the whole cell was lost, since
  # results are only emitted when the worker finishes.
  timeout_s: 21600
  model: Qwen/Qwen3-ForcedAligner-0.6B
  language: English
